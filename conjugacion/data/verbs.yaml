# =====================================================================
#  La Conjugaison Espagnole: the single source of truth
#  Every conjugated form in the guide comes from this file.
#  Person order everywhere: yo, tú, él/ella/usted, nosotros, vosotros, ellos/ellas/ustedes
# =====================================================================

persons:
  - {key: yo,       label: "yo",                    short: "yo",       marker: "o",   fr: "je",          fr_end: "-e / -s"}
  - {key: tu,       label: "tú",                    short: "tú",       marker: "s",   fr: "tu",          fr_end: "-s"}
  - {key: el,       label: "él / ella / usted",     short: "él",       marker: "",    fr: "il / elle",   fr_end: "-e / -t"}
  - {key: nosotros, label: "nosotros/as",   short: "nosotros", marker: "mos", fr: "nous",        fr_end: "-ons"}
  - {key: vosotros, label: "vosotros/as",   short: "vosotros", marker: "is",  fr: "vous",        fr_end: "-ez"}
  - {key: ellos,    label: "ellos / ellas / ustedes", short: "ellos",  marker: "n",   fr: "ils / elles", fr_end: "-ent"}

imperative_persons:
  - {key: tu,       label: "tú"}
  - {key: usted,    label: "usted"}
  - {key: nosotros, label: "nosotros"}
  - {key: vosotros, label: "vosotros"}
  - {key: ustedes,  label: "ustedes"}

classes:
  ar: {theme_vowel: a, colour: terracotta}
  er: {theme_vowel: e, colour: olive}
  ir: {theme_vowel: e, colour: blue}

# ---------------------------------------------------------------------
#  Tenses: names and regular endings.
#  base: what the ending is glued to
#    stem       = infinitive minus -ar/-er/-ir
#    infinitive = the whole infinitive
#    yo_stem    = present "yo" form minus -o
#    ellos_pret = 3rd person plural indefinido minus -ron
# ---------------------------------------------------------------------
tenses:
  presente:
    es: "Presente de indicativo"
    en: "Present"
    base: stem
    endings:
      ar: [o, as, a, amos, áis, an]
      er: [o, es, e, emos, éis, en]
      ir: [o, es, e, imos, ís, en]
  indefinido:
    es: "Pretérito indefinido"
    en: "Simple past"
    base: stem
    endings:
      ar: [é, aste, ó, amos, asteis, aron]
      er: [í, iste, ió, imos, isteis, ieron]
      ir: [í, iste, ió, imos, isteis, ieron]
  imperfecto:
    es: "Pretérito imperfecto"
    en: "Imperfect (past background)"
    base: stem
    endings:
      ar: [aba, abas, aba, ábamos, abais, aban]
      er: [ía, ías, ía, íamos, íais, ían]
      ir: [ía, ías, ía, íamos, íais, ían]
  futuro:
    es: "Futuro simple"
    en: "Future"
    base: infinitive
    endings:
      ar: [é, ás, á, emos, éis, án]
      er: [é, ás, á, emos, éis, án]
      ir: [é, ás, á, emos, éis, án]
  condicional:
    es: "Condicional simple"
    en: "Conditional"
    base: infinitive
    endings:
      ar: [ía, ías, ía, íamos, íais, ían]
      er: [ía, ías, ía, íamos, íais, ían]
      ir: [ía, ías, ía, íamos, íais, ían]
  subj_presente:
    es: "Presente de subjuntivo"
    en: "Present subjunctive"
    base: yo_stem
    endings:
      ar: [e, es, e, emos, éis, en]
      er: [a, as, a, amos, áis, an]
      ir: [a, as, a, amos, áis, an]
  subj_imperfecto:
    es: "Pretérito imperfecto de subjuntivo"
    en: "Imperfect subjunctive"
    base: ellos_pret
    endings:
      ar: [ra, ras, ra, ramos, rais, ran]
      er: [ra, ras, ra, ramos, rais, ran]
      ir: [ra, ras, ra, ramos, rais, ran]

# Endings used by the irregular-stem preterites (tuv-e, hic-e, dij-e ...)
strong_preterite_endings: [e, iste, o, imos, isteis, ieron]
strong_preterite_j_ellos: eron     # dijeron, trajeron (never *dijieron)

strong_preterite_stems:
  - {verb: tener,  stem: tuv}
  - {verb: estar,  stem: estuv}
  - {verb: poder,  stem: pud}
  - {verb: poner,  stem: pus}
  - {verb: hacer,  stem: hic}
  - {verb: querer, stem: quis}
  - {verb: venir,  stem: vin}
  - {verb: decir,  stem: dij}
  - {verb: traer,  stem: traj}
  - {verb: saber,  stem: sup}
  - {verb: haber,  stem: hub}

future_stems:
  - {verb: tener,  stem: tendr}
  - {verb: poner,  stem: pondr}
  - {verb: salir,  stem: saldr}
  - {verb: venir,  stem: vendr}
  - {verb: poder,  stem: podr}
  - {verb: saber,  stem: sabr}
  - {verb: haber,  stem: habr}
  - {verb: querer, stem: querr}
  - {verb: decir,  stem: dir}
  - {verb: hacer,  stem: har}
  - {verb: caber,  stem: cabr}
  - {verb: valer,  stem: valdr}

irregular_participles:
  - {verb: hacer,    participle: hecho,   fr: "fait"}
  - {verb: decir,    participle: dicho,   fr: "dit"}
  - {verb: ver,      participle: visto,   fr: "vu"}
  - {verb: escribir, participle: escrito, fr: "écrit"}
  - {verb: poner,    participle: puesto,  fr: "mis"}
  - {verb: volver,   participle: vuelto,  fr: "revenu"}
  - {verb: abrir,    participle: abierto, fr: "ouvert"}
  - {verb: romper,   participle: roto,    fr: "cassé"}
  - {verb: morir,    participle: muerto,  fr: "mort"}

# Extra non-finite forms used on the gerund & participle page
nonfinite_extra:
  - {verb: leer,     en: "to read",       fr: "lire",        gerundio: leyendo,   participio: leído}
  - {verb: caer,     en: "to fall",       fr: "tomber",      gerundio: cayendo,   participio: caído}
  - {verb: morir,    en: "to die",        fr: "mourir",      gerundio: muriendo,  participio: muerto}
  - {verb: abrir,    en: "to open",       fr: "ouvrir",      gerundio: abriendo,  participio: abierto}
  - {verb: romper,   en: "to break",      fr: "casser",      gerundio: rompiendo, participio: roto}

# ---------------------------------------------------------------------
#  VERBS
#  regular: true  -> every form must be reproducible from the rule
#  regular_except -> tenses of an otherwise regular verb that are not
#  imperativo: tu, usted, nosotros, vosotros, ustedes (null = not used)
# ---------------------------------------------------------------------
verbs:

  # ---------- model regular verbs ----------
  hablar:
    en: "to speak"
    fr: "parler"
    regular: true
    presente:        [hablo, hablas, habla, hablamos, habláis, hablan]
    indefinido:      [hablé, hablaste, habló, hablamos, hablasteis, hablaron]
    imperfecto:      [hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban]
    futuro:          [hablaré, hablarás, hablará, hablaremos, hablaréis, hablarán]
    condicional:     [hablaría, hablarías, hablaría, hablaríamos, hablaríais, hablarían]
    subj_presente:   [hable, hables, hable, hablemos, habléis, hablen]
    subj_imperfecto: [hablara, hablaras, hablara, habláramos, hablarais, hablaran]
    imperativo:      [habla, hable, hablemos, hablad, hablen]
    gerundio: hablando
    participio: hablado
    examples:
      - {es: "*Hablo* español, francés y árabe.", fr: "Je parle espagnol, français et arabe."}
      - {es: "¿*Hablas* inglés?", fr: "Tu parles anglais ?"}
      - {es: "Mis padres *hablan* darija en casa.", fr: "Mes parents parlent darija à la maison."}

  comer:
    en: "to eat"
    fr: "manger"
    regular: true
    presente:        [como, comes, come, comemos, coméis, comen]
    indefinido:      [comí, comiste, comió, comimos, comisteis, comieron]
    imperfecto:      [comía, comías, comía, comíamos, comíais, comían]
    futuro:          [comeré, comerás, comerá, comeremos, comeréis, comerán]
    condicional:     [comería, comerías, comería, comeríamos, comeríais, comerían]
    subj_presente:   [coma, comas, coma, comamos, comáis, coman]
    subj_imperfecto: [comiera, comieras, comiera, comiéramos, comierais, comieran]
    imperativo:      [come, coma, comamos, comed, coman]
    gerundio: comiendo
    participio: comido
    examples:
      - {es: "*Como* en casa a las dos.", fr: "Je mange à la maison à deux heures."}
      - {es: "¿Qué *comes* en el desayuno?", fr: "Qu’est-ce que tu manges au petit-déjeuner ?"}
      - {es: "Los domingos *comemos* con mi abuela.", fr: "Le dimanche, nous déjeunons chez ma grand-mère."}

  vivir:
    en: "to live"
    fr: "vivre, habiter"
    regular: true
    presente:        [vivo, vives, vive, vivimos, vivís, viven]
    indefinido:      [viví, viviste, vivió, vivimos, vivisteis, vivieron]
    imperfecto:      [vivía, vivías, vivía, vivíamos, vivíais, vivían]
    futuro:          [viviré, vivirás, vivirá, viviremos, viviréis, vivirán]
    condicional:     [viviría, vivirías, viviría, viviríamos, viviríais, vivirían]
    subj_presente:   [viva, vivas, viva, vivamos, viváis, vivan]
    subj_imperfecto: [viviera, vivieras, viviera, viviéramos, vivierais, vivieran]
    imperativo:      [vive, viva, vivamos, vivid, vivan]
    gerundio: viviendo
    participio: vivido
    examples:
      - {es: "*Vivo* en Casablanca.", fr: "J’habite à Casablanca."}
      - {es: "¿Dónde *vives*?", fr: "Où est-ce que tu habites ?"}
      - {es: "Mis primos *viven* en Madrid.", fr: "Mes cousins habitent à Madrid."}

  # ---------- more regular verbs (used in exercises) ----------
  trabajar:
    en: "to work"
    fr: "travailler"
    regular: true
    presente:        [trabajo, trabajas, trabaja, trabajamos, trabajáis, trabajan]
    indefinido:      [trabajé, trabajaste, trabajó, trabajamos, trabajasteis, trabajaron]
    imperfecto:      [trabajaba, trabajabas, trabajaba, trabajábamos, trabajabais, trabajaban]
    futuro:          [trabajaré, trabajarás, trabajará, trabajaremos, trabajaréis, trabajarán]
    subj_presente:   [trabaje, trabajes, trabaje, trabajemos, trabajéis, trabajen]
    gerundio: trabajando
    participio: trabajado

  estudiar:
    en: "to study"
    fr: "étudier"
    regular: true
    presente:        [estudio, estudias, estudia, estudiamos, estudiáis, estudian]
    indefinido:      [estudié, estudiaste, estudió, estudiamos, estudiasteis, estudiaron]
    imperfecto:      [estudiaba, estudiabas, estudiaba, estudiábamos, estudiabais, estudiaban]
    futuro:          [estudiaré, estudiarás, estudiará, estudiaremos, estudiaréis, estudiarán]
    subj_presente:   [estudie, estudies, estudie, estudiemos, estudiéis, estudien]
    gerundio: estudiando
    participio: estudiado

  beber:
    en: "to drink"
    fr: "boire"
    regular: true
    presente:        [bebo, bebes, bebe, bebemos, bebéis, beben]
    indefinido:      [bebí, bebiste, bebió, bebimos, bebisteis, bebieron]
    imperfecto:      [bebía, bebías, bebía, bebíamos, bebíais, bebían]
    futuro:          [beberé, beberás, beberá, beberemos, beberéis, beberán]
    subj_presente:   [beba, bebas, beba, bebamos, bebáis, beban]
    gerundio: bebiendo
    participio: bebido

  aprender:
    en: "to learn"
    fr: "apprendre"
    regular: true
    presente:        [aprendo, aprendes, aprende, aprendemos, aprendéis, aprenden]
    indefinido:      [aprendí, aprendiste, aprendió, aprendimos, aprendisteis, aprendieron]
    imperfecto:      [aprendía, aprendías, aprendía, aprendíamos, aprendíais, aprendían]
    futuro:          [aprenderé, aprenderás, aprenderá, aprenderemos, aprenderéis, aprenderán]
    subj_presente:   [aprenda, aprendas, aprenda, aprendamos, aprendáis, aprendan]
    gerundio: aprendiendo
    participio: aprendido

  escribir:
    en: "to write"
    fr: "écrire"
    regular: true
    regular_except: [participio]
    presente:        [escribo, escribes, escribe, escribimos, escribís, escriben]
    indefinido:      [escribí, escribiste, escribió, escribimos, escribisteis, escribieron]
    imperfecto:      [escribía, escribías, escribía, escribíamos, escribíais, escribían]
    futuro:          [escribiré, escribirás, escribirá, escribiremos, escribiréis, escribirán]
    subj_presente:   [escriba, escribas, escriba, escribamos, escribáis, escriban]
    gerundio: escribiendo
    participio: escrito

  # ---------- regular verbs used with pronouns ----------
  gustar:
    en: "to please (to like)"
    fr: "plaire (→ aimer)"
    regular: true
    presente:        [gusto, gustas, gusta, gustamos, gustáis, gustan]
    condicional:     [gustaría, gustarías, gustaría, gustaríamos, gustaríais, gustarían]
    imperfecto:      [gustaba, gustabas, gustaba, gustábamos, gustabais, gustaban]
    gerundio: gustando
    participio: gustado

  # ---------- reflexive verbs (present only) ----------
  levantarse:
    en: "to get up"
    fr: "se lever"
    regular: true
    reflexive: true
    presente: ["me levanto", "te levantas", "se levanta", "nos levantamos", "os levantáis", "se levantan"]
    examples:
      - {es: "*Me levanto* a las siete.", fr: "Je me lève à sept heures."}
      - {es: "Los sábados *nos levantamos* tarde.", fr: "Le samedi, nous nous levons tard."}
  llamarse:
    en: "to be called"
    fr: "s'appeler"
    regular: true
    reflexive: true
    presente: ["me llamo", "te llamas", "se llama", "nos llamamos", "os llamáis", "se llaman"]
    examples:
      - {es: "¿Cómo *te llamas*?", fr: "Comment tu t’appelles ?"}
      - {es: "*Me llamo* Sara.", fr: "Je m’appelle Sara."}
  ducharse:
    en: "to have a shower"
    fr: "se doucher"
    regular: true
    reflexive: true
    presente: ["me ducho", "te duchas", "se ducha", "nos duchamos", "os ducháis", "se duchan"]
    examples:
      - {es: "Mi hermano *se ducha* por la noche.", fr: "Mon frère se douche le soir."}

  # ---------- stem-changing ("boot") verbs ----------
  pensar:
    en: "to think"
    fr: "penser"
    change: "e → ie"
    presente:        [pienso, piensas, piensa, pensamos, pensáis, piensan]
    indefinido:      [pensé, pensaste, pensó, pensamos, pensasteis, pensaron]
    imperfecto:      [pensaba, pensabas, pensaba, pensábamos, pensabais, pensaban]
    futuro:          [pensaré, pensarás, pensará, pensaremos, pensaréis, pensarán]
    condicional:     [pensaría, pensarías, pensaría, pensaríamos, pensaríais, pensarían]
    subj_presente:   [piense, pienses, piense, pensemos, penséis, piensen]
    subj_imperfecto: [pensara, pensaras, pensara, pensáramos, pensarais, pensaran]
    imperativo:      [piensa, piense, pensemos, pensad, piensen]
    gerundio: pensando
    participio: pensado
    examples:
      - {es: "¿Qué *piensas*?", fr: "Qu’est-ce que tu en penses ?"}

  querer:
    en: "to want; to love"
    fr: "vouloir ; aimer"
    change: "e → ie"
    presente:        [quiero, quieres, quiere, queremos, queréis, quieren]
    indefinido:      [quise, quisiste, quiso, quisimos, quisisteis, quisieron]
    imperfecto:      [quería, querías, quería, queríamos, queríais, querían]
    futuro:          [querré, querrás, querrá, querremos, querréis, querrán]
    condicional:     [querría, querrías, querría, querríamos, querríais, querrían]
    subj_presente:   [quiera, quieras, quiera, queramos, queráis, quieran]
    subj_imperfecto: [quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran]
    imperativo:      [quiere, quiera, queramos, quered, quieran]
    gerundio: queriendo
    participio: querido
    examples:
      - {es: "*Quiero* un café, por favor.", fr: "Je voudrais un café, s’il vous plaît."}

  empezar:
    en: "to begin"
    fr: "commencer"
    change: "e → ie"
    presente:        [empiezo, empiezas, empieza, empezamos, empezáis, empiezan]
    indefinido:      [empecé, empezaste, empezó, empezamos, empezasteis, empezaron]
    imperfecto:      [empezaba, empezabas, empezaba, empezábamos, empezabais, empezaban]
    futuro:          [empezaré, empezarás, empezará, empezaremos, empezaréis, empezarán]
    condicional:     [empezaría, empezarías, empezaría, empezaríamos, empezaríais, empezarían]
    subj_presente:   [empiece, empieces, empiece, empecemos, empecéis, empiecen]
    subj_imperfecto: [empezara, empezaras, empezara, empezáramos, empezarais, empezaran]
    imperativo:      [empieza, empiece, empecemos, empezad, empiecen]
    gerundio: empezando
    participio: empezado
    examples:
      - {es: "La clase *empieza* a las nueve.", fr: "Le cours commence à neuf heures."}

  poder:
    en: "can, to be able to"
    fr: "pouvoir"
    change: "o → ue"
    presente:        [puedo, puedes, puede, podemos, podéis, pueden]
    indefinido:      [pude, pudiste, pudo, pudimos, pudisteis, pudieron]
    imperfecto:      [podía, podías, podía, podíamos, podíais, podían]
    futuro:          [podré, podrás, podrá, podremos, podréis, podrán]
    condicional:     [podría, podrías, podría, podríamos, podríais, podrían]
    subj_presente:   [pueda, puedas, pueda, podamos, podáis, puedan]
    subj_imperfecto: [pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran]
    imperativo:      [null, null, null, null, null]
    gerundio: pudiendo
    participio: podido
    examples:
      - {es: "¿*Puedes* repetir, por favor?", fr: "Tu peux répéter, s’il te plaît ?"}

  dormir:
    en: "to sleep"
    fr: "dormir"
    change: "o → ue"
    presente:        [duermo, duermes, duerme, dormimos, dormís, duermen]
    indefinido:      [dormí, dormiste, durmió, dormimos, dormisteis, durmieron]
    imperfecto:      [dormía, dormías, dormía, dormíamos, dormíais, dormían]
    futuro:          [dormiré, dormirás, dormirá, dormiremos, dormiréis, dormirán]
    condicional:     [dormiría, dormirías, dormiría, dormiríamos, dormiríais, dormirían]
    subj_presente:   [duerma, duermas, duerma, durmamos, durmáis, duerman]
    subj_imperfecto: [durmiera, durmieras, durmiera, durmiéramos, durmierais, durmieran]
    imperativo:      [duerme, duerma, durmamos, dormid, duerman]
    gerundio: durmiendo
    participio: dormido
    examples:
      - {es: "*Duermo* ocho horas.", fr: "Je dors huit heures."}

  volver:
    en: "to come back, to return"
    fr: "revenir, rentrer"
    change: "o → ue"
    presente:        [vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven]
    indefinido:      [volví, volviste, volvió, volvimos, volvisteis, volvieron]
    imperfecto:      [volvía, volvías, volvía, volvíamos, volvíais, volvían]
    futuro:          [volveré, volverás, volverá, volveremos, volveréis, volverán]
    condicional:     [volvería, volverías, volvería, volveríamos, volveríais, volverían]
    subj_presente:   [vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan]
    subj_imperfecto: [volviera, volvieras, volviera, volviéramos, volvierais, volvieran]
    imperativo:      [vuelve, vuelva, volvamos, volved, vuelvan]
    gerundio: volviendo
    participio: vuelto
    examples:
      - {es: "*Volvemos* a casa a las seis.", fr: "Nous rentrons à la maison à six heures."}

  pedir:
    en: "to ask for, to order"
    fr: "demander, commander"
    change: "e → i"
    presente:        [pido, pides, pide, pedimos, pedís, piden]
    indefinido:      [pedí, pediste, pidió, pedimos, pedisteis, pidieron]
    imperfecto:      [pedía, pedías, pedía, pedíamos, pedíais, pedían]
    futuro:          [pediré, pedirás, pedirá, pediremos, pediréis, pedirán]
    condicional:     [pediría, pedirías, pediría, pediríamos, pediríais, pedirían]
    subj_presente:   [pida, pidas, pida, pidamos, pidáis, pidan]
    subj_imperfecto: [pidiera, pidieras, pidiera, pidiéramos, pidierais, pidieran]
    imperativo:      [pide, pida, pidamos, pedid, pidan]
    gerundio: pidiendo
    participio: pedido
    examples:
      - {es: "Siempre *pido* lo mismo.", fr: "Je commande toujours la même chose."}

  repetir:
    en: "to repeat"
    fr: "répéter"
    change: "e → i"
    presente:        [repito, repites, repite, repetimos, repetís, repiten]
    indefinido:      [repetí, repetiste, repitió, repetimos, repetisteis, repitieron]
    gerundio: repitiendo
    participio: repetido
    examples:
      - {es: "El profesor *repite* la pregunta.", fr: "Le professeur répète la question."}

  jugar:
    en: "to play (a game, a sport)"
    fr: "jouer"
    change: "u → ue"
    presente:        [juego, juegas, juega, jugamos, jugáis, juegan]
    indefinido:      [jugué, jugaste, jugó, jugamos, jugasteis, jugaron]
    imperfecto:      [jugaba, jugabas, jugaba, jugábamos, jugabais, jugaban]
    futuro:          [jugaré, jugarás, jugará, jugaremos, jugaréis, jugarán]
    condicional:     [jugaría, jugarías, jugaría, jugaríamos, jugaríais, jugarían]
