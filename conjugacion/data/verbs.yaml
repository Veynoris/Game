# ---------------------------------------------------------------------
#  Groups shown in the book (order = order on the page)
# ---------------------------------------------------------------------
groups:
  models: [hablar, comer, vivir]
  boot:
    - {change: "e → ie", verbs: [querer, pensar, empezar]}
    - {change: "o → ue", verbs: [poder, dormir, volver]}
    - {change: "e → i",  verbs: [pedir, repetir]}
    - {change: "u → ue", verbs: [jugar]}
  yo_irregular: [hacer, poner, salir, traer, saber, conocer, ver, dar]
  fully_irregular: [ser, estar, ir, tener, venir, decir, oír, haber]
  reflexive: [levantarse, llamarse, ducharse]
  imperfect_irregular: [ser, ir, ver]
  subj_irregular: [ser, estar, ir, haber, saber, dar]
  imperative_irregular: [decir, hacer, ir, poner, salir, ser, tener, venir]
  top25: [ser, estar, haber, tener, hacer, poder, decir, ir, ver, dar,
          saber, querer, poner, venir, salir, conocer, pensar, volver, pedir,
          dormir, oír, traer, empezar, jugar, sentir]

# ---------------------------------------------------------------------
#  Gustar-type verbs: the verb agrees with the THING, not the person
# ---------------------------------------------------------------------
gustar_pronouns:
  - {stress: "a mí",               pron: me,  fr: "à moi"}
  - {stress: "a ti",               pron: te,  fr: "à toi"}
  - {stress: "a él / a ella / a usted", pron: le, fr: "à lui / à elle / à vous (politesse)"}
  - {stress: "a nosotros/as",      pron: nos, fr: "à nous"}
  - {stress: "a vosotros/as",      pron: os,  fr: "à vous (pluriel)"}
  - {stress: "a ellos / a ellas / a ustedes", pron: les, fr: "à eux / à elles / à vous (pluriel poli)"}

gustar_type:
  - {verb: gustar,    en: "to please → to like",          fr: "plaire → aimer",         sg: gusta,    pl: gustan}
  - {verb: encantar,  en: "to delight → to love",         fr: "adorer",         sg: encanta,  pl: encantan}
  - {verb: interesar, en: "to interest",                  fr: "intéresser",     sg: interesa, pl: interesan}
  - {verb: doler,     en: "to hurt",                      fr: "faire mal",      sg: duele,    pl: duelen}
  - {verb: molestar,  en: "to bother",                    fr: "déranger, gêner", sg: molesta, pl: molestan}

# ---------------------------------------------------------------------
#  Example sentences by topic (the conjugated verb is between *stars*)
# ---------------------------------------------------------------------
sentences:
  gustar:
    - {es: "*Me gusta* el café.", fr: "J’aime le café. (Le café me plaît.)"}
    - {es: "*Me gustan* los idiomas.", fr: "J’aime les langues."}
    - {es: "¿*Te gusta* bailar?", fr: "Tu aimes danser ?"}
    - {es: "A mi madre *le encanta* el té con menta.", fr: "Ma mère adore le thé à la menthe."}
    - {es: "*Nos interesa* mucho la historia.", fr: "L’histoire nous intéresse beaucoup."}
    - {es: "*Me duele* la cabeza.", fr: "J’ai mal à la tête."}
    - {es: "*Me duelen* los pies.", fr: "J’ai mal aux pieds."}
    - {es: "*Le molesta* el ruido.", fr: "Le bruit le / la dérange."}

  ser:
    - {es: "*Soy* profesora.", fr: "Je suis professeure. (sans article !)"}
    - {es: "Ahmed *es* de Tánger.", fr: "Ahmed est de Tanger."}
    - {es: "*Son* las cinco.", fr: "Il est cinq heures."}
    - {es: "La fiesta *es* en mi casa.", fr: "La fête a lieu chez moi. (événement → ser)"}
  estar:
    - {es: "Sevilla *está* en Andalucía.", fr: "Séville est en Andalousie."}
    - {es: "Hoy *estoy* cansado.", fr: "Aujourd’hui, je suis fatigué."}
    - {es: "*Estamos* comiendo.", fr: "Nous sommes en train de manger."}
    - {es: "La sopa *está* fría.", fr: "La soupe est froide."}

  perfecto:
    - {es: "Hoy *he comido* cuscús.", fr: "Aujourd’hui, j’ai mangé du couscous."}
    - {es: "Esta semana *hemos trabajado* mucho.", fr: "Cette semaine, nous avons beaucoup travaillé."}
    - {es: "¿*Has estado* alguna vez en México?", fr: "Tu es déjà allé au Mexique ?"}
    - {es: "Todavía no *he hecho* los deberes.", fr: "Je n’ai pas encore fait mes devoirs."}

  indefinido:
    - {es: "Ayer *hablé* con mi madre.", fr: "Hier, j’ai parlé avec ma mère."}
    - {es: "En 2019 *viví* en Valencia.", fr: "En 2019, j’ai vécu à Valence."}
    - {es: "El verano pasado *fuimos* a Granada.", fr: "L’été dernier, nous sommes allés à Grenade."}
    - {es: "¿Qué *hiciste* el sábado?", fr: "Qu’est-ce que tu as fait samedi ?"}
    - {es: "Ella *pidió* una pizza.", fr: "Elle a commandé une pizza."}

  imperfecto:
    - {es: "De niña, *vivía* en Fez.", fr: "Petite, j’habitais à Fès."}
    - {es: "Siempre *comíamos* juntos.", fr: "Nous mangions toujours ensemble."}
    - {es: "*Íbamos* a la playa todos los veranos.", fr: "Nous allions à la plage tous les étés."}
    - {es: "*Era* un día precioso.", fr: "C’était une journée magnifique."}

  contrast:
    - {es: "*Estudiaba* cuando *sonó* el teléfono.", fr: "J’étudiais quand le téléphone a sonné."}
    - {es: "*Hacía* sol, así que *fuimos* a la playa.", fr: "Il faisait beau, alors nous sommes allés à la plage."}
    - {es: "*Era* tarde y *llovía*. De repente, *llegó* un taxi.", fr: "Il était tard et il pleuvait. Soudain, un taxi est arrivé."}

  ir_a:
    - {es: "*Voy a* estudiar esta tarde.", fr: "Je vais étudier cet après-midi."}
    - {es: "¿Qué *vas a* hacer mañana?", fr: "Qu’est-ce que tu vas faire demain ?"}
    - {es: "*Vamos a* cenar fuera.", fr: "Nous allons dîner au restaurant."}

  futuro:
    - {es: "Mañana *hablaré* con él.", fr: "Demain, je lui parlerai."}
    - {es: "El lunes *tendremos* más tiempo.", fr: "Lundi, nous aurons plus de temps."}
    - {es: "¿*Vendrás* a la boda?", fr: "Tu viendras au mariage ?"}

  condicional:
    - {es: "*Me gustaría* un té, por favor.", fr: "Je voudrais un thé, s’il vous plaît."}
    - {es: "¿*Podrías* ayudarme?", fr: "Tu pourrais m’aider ?"}
    - {es: "Yo que tú, *hablaría* con ella.", fr: "À ta place, je lui parlerais."}

  imperativo:
    - {es: "*Habla* más despacio, por favor.", fr: "Parle plus lentement, s’il te plaît."}
    - {es: "¡*Ven* aquí!", fr: "Viens ici !"}
    - {es: "*Pase*, por favor.", fr: "Entrez, je vous en prie. (usted)"}
    - {es: "No *hables* tan alto.", fr: "Ne parle pas si fort."}

  pronouns:
    - {es: "*Levántate*.", fr: "Lève-toi.", note: "levanta + te : l’accent tonique reste sur -van- → accent écrit"}
    - {es: "*Dímelo*.", fr: "Dis-le-moi.", note: "di + me + lo"}
    - {es: "*Siéntese*, por favor.", fr: "Asseyez-vous, je vous en prie. (usted)", note: "siente + se"}
    - {es: "*Hazlo* ahora.", fr: "Fais-le maintenant.", note: "haz + lo : pas d’accent"}
    - {es: "No *te levantes*.", fr: "Ne te lève pas.", note: "négatif : pronom avant le verbe"}
    - {es: "No *me lo digas*.", fr: "Ne me le dis pas.", note: "négatif : pronoms avant le verbe"}

  subj_uses:
    wishes:
      - {es: "Quiero que *vengas*.", fr: "Je veux que tu viennes."}
      - {es: "Ojalá *haga* buen tiempo.", fr: "Pourvu qu’il fasse beau."}
    emotions:
      - {es: "Me alegra que *estés* aquí.", fr: "Je suis content que tu sois là."}
      - {es: "Siento que *tengas* problemas.", fr: "Je suis désolé que tu aies des problèmes."}
    doubt:
      - {es: "No creo que *sea* verdad.", fr: "Je ne crois pas que ce soit vrai."}
      - {es: "Dudo que *lleguen* a tiempo.", fr: "Je doute qu’ils arrivent à l’heure."}
    purpose:
      - {es: "Te lo explico para que lo *entiendas*.", fr: "Je te l’explique pour que tu le comprennes."}
    time:
      - {es: "Cuando *llegues*, llámame.", fr: "Quand tu arriveras, appelle-moi."}
      - {es: "Te escribo en cuanto *sepa* algo.", fr: "Je t’écris dès que je saurai quelque chose."}
    advice:
      - {es: "Es importante que *duermas* bien.", fr: "Il est important que tu dormes bien."}
      - {es: "Te recomiendo que *pidas* el cuscús.", fr: "Je te conseille de commander le couscous."}

  subj_imperfecto:
    - {es: "Si *tuviera* tiempo, viajaría más.", fr: "Si j’avais le temps, je voyagerais plus."}
    - {es: "Quería que *vinieras*.", fr: "Je voulais que tu viennes."}
    - {es: "Si *fuera* tú, no lo haría.", fr: "Si j’étais toi, je ne le ferais pas."}

# ---------------------------------------------------------------------
#  EXERCISES
#  item with lookup -> the answer is read from the verb tables above
#  item with answer -> a free answer (translation, person, stem …)
#  Explanatory text (translations, titles) is in French.
#  lookup tense "perfecto"       = presente of haber + participio
#  lookup tense "imperativo_neg" = no + presente de subjuntivo
# ---------------------------------------------------------------------
exercises:
  part0:
    - title: "Qui est-ce ? Trouve la personne grâce à la terminaison."
      items:
        - {q: "comemos", answer: "nosotros"}
        - {q: "vives", answer: "tú"}
        - {q: "hablan", answer: "ellos / ellas / ustedes"}
        - {q: "bebo", answer: "yo"}
        - {q: "estudiáis", answer: "vosotros"}
        - {q: "trabaja", answer: "él / ella / usted"}
    - title: "Trouve le radical."
      items:
        - {q: "aprender", answer: "aprend-"}
        - {q: "escribir", answer: "escrib-"}
        - {q: "estudiar", answer: "estudi-"}
    - title: "Construis la forme : radical + voyelle + marque."
      items:
        - {q: "trabaj- + a + (nosotros)", lookup: {verb: trabajar, tense: presente, person: nosotros}}
        - {q: "beb- + e + (ellos)", lookup: {verb: beber, tense: presente, person: ellos}}
        - {q: "habl- + a + (tú)", lookup: {verb: hablar, tense: presente, person: tu}}

  part1:
    - title: "Complète avec le présent."
      items:
        - {q: "Yo ___ francés y árabe. (hablar)", lookup: {verb: hablar, tense: presente, person: yo}}
        - {q: "Nosotros ___ en Casablanca. (vivir)", lookup: {verb: vivir, tense: presente, person: nosotros}}
        - {q: "¿Tú ___ carne? (comer)", lookup: {verb: comer, tense: presente, person: tu}}
        - {q: "Ella ___ un café. (querer)", lookup: {verb: querer, tense: presente, person: el}}
        - {q: "Nosotros no ___ venir mañana. (poder)", lookup: {verb: poder, tense: presente, person: nosotros}}
        - {q: "Mis padres ___ poco. (dormir)", lookup: {verb: dormir, tense: presente, person: ellos}}
        - {q: "¿Vosotros ___ al tenis? (jugar)", lookup: {verb: jugar, tense: presente, person: vosotros}}
        - {q: "Yo ___ los deberes por la noche. (hacer)", lookup: {verb: hacer, tense: presente, person: yo}}
        - {q: "Yo no ___ a tu hermana. (conocer)", lookup: {verb: conocer, tense: presente, person: yo}}
        - {q: "¿___ (tú) con nosotros? (venir)", lookup: {verb: venir, tense: presente, person: tu, cap: true}}
    - title: "Ser ou estar ?"
      items:
        - {q: "Madrid ___ en España.", lookup: {verb: estar, tense: presente, person: el}}
        - {q: "Mi hermano ___ médico.", lookup: {verb: ser, tense: presente, person: el}}
        - {q: "Hoy (yo) ___ muy cansada.", lookup: {verb: estar, tense: presente, person: yo}}
    - title: "Gusta ou gustan ?"
      items:
        - {q: "Me ___ los libros de historia.", lookup: {verb: gustar, tense: presente, person: ellos}}
        - {q: "A Leila le ___ el té.", lookup: {verb: gustar, tense: presente, person: el}}

  part2:
    - title: "Pretérito perfecto : haber + participe."
      items:
        - {q: "Hoy (yo) ___ en casa. (comer)", lookup: {verb: comer, tense: perfecto, person: yo}}
        - {q: "Esta semana (nosotros) ___ mucho. (trabajar)", lookup: {verb: trabajar, tense: perfecto, person: nosotros}}
        - {q: "¿___ (tú) la película? (ver)", lookup: {verb: ver, tense: perfecto, person: tu, cap: true}}
        - {q: "Todavía no (ellos) ___ nada. (decir)", lookup: {verb: decir, tense: perfecto, person: ellos}}
    - title: "Indefinido : une action terminée."
      items:
        - {q: "Ayer (yo) ___ con Marta. (hablar)", lookup: {verb: hablar, tense: indefinido, person: yo}}
        - {q: "El año pasado ellos ___ a Granada. (ir)", lookup: {verb: ir, tense: indefinido, person: ellos}}
        - {q: "Ella ___ una pizza. (pedir)", lookup: {verb: pedir, tense: indefinido, person: el}}
        - {q: "Anoche (yo) no ___ dormir. (poder)", lookup: {verb: poder, tense: indefinido, person: yo}}
        - {q: "¿Qué ___ (tú) el sábado? (hacer)", lookup: {verb: hacer, tense: indefinido, person: tu}}
    - title: "Imperfecto : décor et habitudes."
      items:
        - {q: "De niño, (yo) ___ en Fez. (vivir)", lookup: {verb: vivir, tense: imperfecto, person: yo}}
        - {q: "Antes (nosotros) ___ a la playa cada verano. (ir)", lookup: {verb: ir, tense: imperfecto, person: nosotros}}
        - {q: "___ las diez de la noche. (ser)", lookup: {verb: ser, tense: imperfecto, person: ellos, cap: true}}
    - title: "Traduis en espagnol."
      items:
        - {q: "J’étudiais quand mon ami est arrivé.", answer: "Estudiaba cuando llegó mi amigo / mi amiga."}

  part3:
    - title: "Ir a + infinitif."
      items:
        - {q: "Mañana (yo) ___ estudiar.", answer: "voy a"}
        - {q: "¿Qué ___ hacer vosotros el domingo?", answer: "vais a"}
    - title: "Futuro simple."
      items:
        - {q: "El lunes (yo) ___ tiempo. (tener)", lookup: {verb: tener, tense: futuro, person: yo}}
        - {q: "¿Qué ___ vosotros en verano? (hacer)", lookup: {verb: hacer, tense: futuro, person: vosotros}}
        - {q: "Mis tíos ___ en mayo. (venir)", lookup: {verb: venir, tense: futuro, person: ellos}}
        - {q: "Tú ___ hacerlo. (poder)", lookup: {verb: poder, tense: futuro, person: tu}}
        - {q: "Nosotros ___ en Madrid. (vivir)", lookup: {verb: vivir, tense: futuro, person: nosotros}}
        - {q: "Mañana te lo ___ (yo). (decir)", lookup: {verb: decir, tense: futuro, person: yo}}
    - title: "Condicional."
      items:
        - {q: "¿___ (tú) ayudarme? (poder)", lookup: {verb: poder, tense: condicional, person: tu, cap: true}}
        - {q: "Me ___ un zumo de naranja. (gustar)", lookup: {verb: gustar, tense: condicional, person: el}}
        - {q: "Yo que tú, no lo ___. (hacer)", lookup: {verb: hacer, tense: condicional, person: yo}}
        - {q: "Nosotros ___ más tarde. (salir)", lookup: {verb: salir, tense: condicional, person: nosotros}}

  part4:
    - title: "Tú, affirmatif."
      items:
        - {q: "___ más despacio. (hablar)", lookup: {verb: hablar, tense: imperativo, person: tu, cap: true}}
        - {q: "___ aquí. (venir)", lookup: {verb: venir, tense: imperativo, person: tu, cap: true}}
        - {q: "___ los deberes. (hacer)", lookup: {verb: hacer, tense: imperativo, person: tu, cap: true}}
        - {q: "___ la verdad. (decir)", lookup: {verb: decir, tense: imperativo, person: tu, cap: true}}
        - {q: "___ la mesa. (poner)", lookup: {verb: poner, tense: imperativo, person: tu, cap: true}}
        - {q: "___ cuidado. (tener)", lookup: {verb: tener, tense: imperativo, person: tu, cap: true}}
    - title: "Usted / ustedes."
      items:
        - {q: "___ más alto, por favor. (hablar, usted)", lookup: {verb: hablar, tense: imperativo, person: usted, cap: true}}
        - {q: "___ mañana a las diez. (venir, ustedes)", lookup: {verb: venir, tense: imperativo, person: ustedes, cap: true}}
    - title: "Mets à la forme négative."
      items:
        - {q: "Come eso. → ___ eso.", lookup: {verb: comer, tense: imperativo_neg, person: tu, cap: true}}
        - {q: "Ve a la fiesta. → ___ a la fiesta.", lookup: {verb: ir, tense: imperativo_neg, person: tu, cap: true}}
    - title: "Attache le pronom."
      items:
        - {q: "(levantarse, tú) ___ ya.", answer: "Levántate"}
        - {q: "(decir + me, tú) ___ la verdad.", answer: "Dime"}

  part5:
    - title: "Subjonctif présent."
      items:
        - {q: "Quiero que (tú) ___ a la fiesta. (venir)", lookup: {verb: venir, tense: subj_presente, person: tu}}
        - {q: "Espero que (vosotros) ___ bien. (estar)", lookup: {verb: estar, tense: subj_presente, person: vosotros}}
        - {q: "Ojalá (nosotros) ___ suerte. (tener)", lookup: {verb: tener, tense: subj_presente, person: nosotros}}
        - {q: "Te lo digo para que lo ___. (saber, tú)", lookup: {verb: saber, tense: subj_presente, person: tu}}
        - {q: "Cuando (tú) ___ mayor, lo entenderás. (ser)", lookup: {verb: ser, tense: subj_presente, person: tu}}
        - {q: "Dudo que ellos ___ hoy. (ir)", lookup: {verb: ir, tense: subj_presente, person: ellos}}
        - {q: "No creo que (él) ___ venir. (poder)", lookup: {verb: poder, tense: subj_presente, person: el}}
        - {q: "Es importante que (nosotros) ___ bien. (dormir)", lookup: {verb: dormir, tense: subj_presente, person: nosotros}}
    - title: "Subjonctif imparfait."
      items:
        - {q: "Si (yo) ___ dinero, viajaría. (tener)", lookup: {verb: tener, tense: subj_imperfecto, person: yo}}
        - {q: "Si (nosotros) ___ en Madrid, saldríamos más. (vivir)", lookup: {verb: vivir, tense: subj_imperfecto, person: nosotros}}
        - {q: "Quería que (tú) ___ conmigo. (venir)", lookup: {verb: venir, tense: subj_imperfecto, person: tu}}
    - title: "Transforme : commence par « Quiero que… »."
      items:
        - {q: "Haces los deberes. → Quiero que ___ los deberes.", lookup: {verb: hacer, tense: subj_presente, person: tu}}
